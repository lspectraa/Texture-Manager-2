name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles msi"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync version from package.json
        run: npm run sync:version

      - name: Fetch upscaler ncnn sidecars and models
        run: node ./scripts/fetch-upscaler-binaries.mjs

      - name: Build installer and draft GitHub release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Key was generated with no password. Do not set
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD — GitHub rejects empty secrets,
          # and any non-empty value makes signing fail with "Wrong password".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Texture Manager 2 v__VERSION__"
          releaseBody: "Texture Manager 2 builds — Windows MSI, macOS DMG (Apple Silicon + Intel), and Android APK (arm64)."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          args: ${{ matrix.args }}

  publish-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Install Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android-aarch64

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync version from package.json
        run: npm run sync:version

      - name: Configure Android release signing
        working-directory: src-tauri/gen/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          REQUIRE_SIGNING=false
          if [ "${{ github.event_name }}" = "push" ] && { [ "${{ github.ref_type }}" = "tag" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; }; then
            REQUIRE_SIGNING=true
          fi

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            if [ "$REQUIRE_SIGNING" = true ]; then
              echo "Tagged Android publish requires ANDROID_KEYSTORE_BASE64 (and alias/password). Refusing debug-signed fallback on tags."
              exit 1
            fi
            echo "No ANDROID_KEYSTORE_BASE64 secret; workflow_dispatch fallback — release APK will be debug-signed for sideload."
            exit 0
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEY_ALIAS / ANDROID_KEYSTORE_PASSWORD are missing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tm2-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/tm2-release.jks"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
          } > keystore.properties
          echo "Wrote keystore.properties for release signing."

      - name: Build Android APK
        env:
          CI: true
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
        # Use `npx tauri` (not `npm run tauri`) to skip the desktop upscaler fetch wrapper.
        # `@v0` of tauri-action does not support `mobile: android`, so build here directly.
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Stop Gradle daemons
        if: always()
        run: (cd src-tauri/gen/android && bash ./gradlew --stop) || true

      - name: Resolve version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload APK to draft GitHub release
        id: upload-apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TITLE="Texture Manager 2 v${VERSION}"
          NOTES="Texture Manager 2 builds — Windows MSI, macOS DMG (Apple Silicon + Intel), and Android APK (arm64)."
          ASSET_NAME="Texture-Manager-2-${VERSION}-android-aarch64.apk"

          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' ! -name '*-unsigned.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort)
          fi
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK found under src-tauri/gen/android/app/build/outputs/apk"
            find src-tauri/gen/android/app/build/outputs -type f | head -n 100 || true
            exit 1
          fi
          APK="${APKS[0]}"
          echo "Found built APK: ${APK}"

          TARGET_APK="${RUNNER_TEMP}/${ASSET_NAME}"
          cp "${APK}" "${TARGET_APK}"
          echo "Staged release APK as: ${TARGET_APK}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading APK."
          else
            echo "Creating draft release ${TAG}."
            gh release create "$TAG" --draft --title "$TITLE" --notes "$NOTES"
          fi

          gh release upload "$TAG" "${TARGET_APK}" --clobber

          {
            echo "apk_path=${TARGET_APK}"
            echo "asset_name=${ASSET_NAME}"
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Write android-latest.json
        id: android-latest
        env:
          VERSION: ${{ steps.upload-apk.outputs.version }}
          APK_PATH: ${{ steps.upload-apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          APK_URL="https://github.com/lspectraa/Texture-Manager-2/releases/download/v${VERSION}/Texture-Manager-2-${VERSION}-android-aarch64.apk"
          NOTES="Texture Manager 2 builds — Windows MSI, macOS DMG (Apple Silicon + Intel), and Android APK (arm64)."

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg url "$APK_URL" \
            --arg sha256 "$SHA256" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "aarch64-linux-android": {
                  url: $url,
                  sha256: $sha256
                }
              }
            }' > android-latest.json

          echo "Wrote android-latest.json (sha256=${SHA256})"
          cat android-latest.json

      - name: Upload android-latest.json to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upload-apk.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" android-latest.json --clobber
