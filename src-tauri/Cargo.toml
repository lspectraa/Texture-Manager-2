[package]
name = "texture-manager-2"
version = "0.3.0"
description = "Geometry Dash texture tooling remake"
authors = ["Spectra"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "texture_manager_2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["tiff"] }
plist = "1"
flate2 = "1"
rayon = "1.10"
tauri-plugin-dialog = "2.7"
base64 = "0.22"
regex = "1"
rand = "0.10.1"
sha2 = "0.10"
tauri-plugin-process = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Tauri 2's Linux webview (gtk 0.18 / webkit2gtk 2.0) requires glib ^0.18.
# crates.io tops out at 0.18.5; RUSTSEC-2024-0429 is fixed in 0.20.0, which
# those GTK3 bindings cannot use, and gtk-rs will not ship 0.18.6. This
# replaces glib 0.18.5 with the same crate plus the VariantStrIter soundness
# fix (`&p` → `&mut p`). Drop this patch when Tauri moves to GTK4 / glib ≥ 0.20.
[patch.crates-io]
glib = { path = "vendor/glib" }

