[package]
name = "texture-manager-2"
version = "0.4.1"
default-run = "texture-manager-2"
description = "Geometry Dash texture tooling remake"
authors = ["Spectra"]
license = "GPL-3.0-or-later"
edition = "2021"
# Tauri 2.12.7 (and zip 9.8.1) declare a higher rust-version than 1.88.
# resolver 3 makes `cargo update` skip crates that need a newer compiler.
rust-version = "1.90"
resolver = "3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "texture-manager-2"
path = "src/main.rs"

[[bin]]
name = "generate_android_icons"
path = "dev-tools/generate_android_icons.rs"
required-features = ["icon-gen"]

[features]
default = []
icon-gen = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "texture_manager_2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-opener = "2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_with 3.25 locks a second jiff 1.0 tree (jiff-core, jiff-static, jiff-tzdb)
# even though tauri-utils never enables the jiff features. Keep 3.24, which has
# only the unused jiff 0.2 optional dependency, until upstream settles on one jiff.
serde_with = "=3.24.0"
image = { version = "0.25", features = ["tiff"] }
plist = "1"
flate2 = "1"
rayon = "1.12"
tauri-plugin-dialog = "2.8.4"
base64 = "0.23"
regex = "1"
rand = "0.10"
sha2 = "0.11"
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
webpki-root-certs = "1.0"
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = ["fs", "io-util"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4"

